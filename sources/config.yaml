# gftools builder recipe (https://github.com/googlefonts/gftools/blob/main/docs/gftools-builder/README.md)
sources:
  - Cogncur-Regular.ufo
familyName: Cogncur
buildVariable: false
buildStatic: true
buildOTF: false
buildWebfont: false
autohintTTF: true
outputDir: ../fonts
# Sources are quadratic (TrueType) curves; only skia-pathops can remove overlaps on those.
extraFontmakeArgs: "--overlaps-backend pathops"
