<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alle tekens · Cogncur</title>
<!--HEAD-->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--NAV-->
<main class="page">
  <header class="page-head">
    <h1>Alle tekens</h1>
    <p>Elk teken in de nieuwste versie van het lettertype. Klik op een teken om het groot en in woorden te zien. Klopt er iets niet? Gebruik de knop <strong>Feedback op dit teken</strong>.</p>
  </header>

  <div class="toolbar">
    <div class="chips" id="groups" aria-label="Soort tekens"></div>
    <div class="chips" id="statuses" aria-label="Herkomst"></div>
    <input type="search" id="find" placeholder="Zoek een teken…" aria-label="Zoek een teken" size="14">
    <details class="feats">
      <summary>Lettervormen (<span id="featCount">standaard</span>)</summary>
      <div class="feat-list" id="featList"></div>
      <p class="code-out">Code: <span id="code"></span></p>
    </details>
  </div>

  <div class="layout">
    <section id="grid" aria-label="Tekens"></section>
    <aside class="detail card" id="detail" aria-live="polite">
      <p class="empty">Kies een teken.</p>
    </aside>
  </div>
</main>

<script type="module">
import { loadFont, build, renderLines, shapeKey, feedback, encode, linkCode, decode, defaults,
         cssFeatures, FEATURES, $, hexU, hashParams, setHash, versionText } from './js/vtex.js';

const GROUPS = { lower: 'Kleine letters', upper: 'Hoofdletters', digit: 'Cijfers', punct: 'Leestekens', symbol: 'Symbolen', mark: 'Accenten' };
const STATUS = {
  origineel: ['Origineel', 'Getekend door de ontwerper van Cogncur.'],
  samengesteld: ['Samengesteld', 'Nieuw: letter en accent van de ontwerper, automatisch samengezet.'],
  schets: ['Schets', 'Nieuwe vorm, nog niet goedgekeurd. Er loopt een vraag aan de ontwerper.'],
  nieuw: ['Nieuw', 'Nieuw teken, gemaakt uit vormen van de ontwerper.'],
};
const data = await fetch('data/tekens.json').then(r => r.json());
const chars = data.chars;
const byChar = new Map(chars.map(c => [c.c, c]));

const hp = hashParams();
const state = hp.get('code') ? decode(hp.get('code')) : defaults();
let group = hp.get('groep') || 'all', status = 'all', current = null, words = '';

// ---------- toolbar
function chip(label, pressed, onClick, dot) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', pressed);
  if (dot) { const d = document.createElement('span'); d.className = 'dot ' + dot; b.appendChild(d); }
  b.append(label);
  b.addEventListener('click', onClick);
  return b;
}
function drawToolbar() {
  const g = $('groups'); g.replaceChildren(chip('Alles', group === 'all', () => { group = 'all'; refresh(); }));
  for (const [k, v] of Object.entries(GROUPS)) g.appendChild(chip(v, group === k, () => { group = k; refresh(); }));
  const s = $('statuses'); s.replaceChildren(chip('Alle herkomst', status === 'all', () => { status = 'all'; refresh(); }));
  for (const [k, [v]] of Object.entries(STATUS)) {
    const n = chars.filter(c => c.status === k).length;
    if (n) s.appendChild(chip(`${v} (${n})`, status === k, () => { status = k; refresh(); }, 'st-' + k));
  }
}
function drawFeatures() {
  const list = $('featList'); list.replaceChildren();
  for (const f of FEATURES) {
    const l = document.createElement('label');
    l.className = state[f.tag] ? 'on' : '';
    l.title = f.name;
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!state[f.tag];
    cb.addEventListener('change', () => { state[f.tag] = cb.checked; refresh(); });
    l.append(cb, `${f.tag} · ${f.name}`);
    list.appendChild(l);
  }
  const code = encode(state);
  $('code').textContent = code;
  $('featCount').textContent = code.replace('vtex: ', '');
}

// ---------- grid
function drawGrid() {
  const q = $('find').value.trim();
  const grid = $('grid'); grid.replaceChildren();
  grid.style.fontFeatureSettings = cssFeatures(state);
  let shown = 0;
  for (const [gk, gname] of Object.entries(GROUPS)) {
    if (group !== 'all' && group !== gk) continue;
    const list = chars.filter(c => c.group === gk && (status === 'all' || c.status === status) &&
      (!q || c.c === q || c.c.normalize('NFD')[0] === q || c.name.toLowerCase().includes(q.toLowerCase()) || hexU(c.c).toLowerCase() === q.toLowerCase()));
    if (!list.length) continue;
    const h = document.createElement('h2'); h.className = 'group-title'; h.textContent = `${gname} · ${list.length}`;
    const box = document.createElement('div'); box.className = 'grid'; box.setAttribute('role', 'listbox');
    for (const c of list) {
      const t = document.createElement('button');
      t.type = 'button'; t.className = 'tile'; t.setAttribute('role', 'option');
      t.setAttribute('aria-selected', current === c);
      t.setAttribute('aria-label', `${c.c} ${hexU(c.c)} ${STATUS[c.status][0]}`);
      t.dataset.c = c.c;
      t.innerHTML = '<span class="g"></span><span class="u"></span><span class="st"></span>';
      t.querySelector('.g').textContent = show(c.c);
      t.querySelector('.u').textContent = hexU(c.c).slice(2);
      t.querySelector('.st').className = 'st st-' + c.status;
      t.addEventListener('click', () => select(c, true));
      box.appendChild(t);
    }
    grid.append(h, box);
    shown += list.length;
  }
  if (!shown) grid.innerHTML = '<p class="empty">Geen tekens gevonden.</p>';
}

// ---------- detail
function contextFor(c) {
  const x = c.c;
  switch (c.group) {
    case 'lower': return `n${x}n a${x}e o${x}o ${x}${x}`;
    case 'upper': return `${x}an ${x}o ${x}${x.toLowerCase() === x ? '' : x.toLowerCase()}`;
    case 'digit': return `${x}0 1${x}2 ${x}${x}${x}`;
    case 'mark': return `a${x} n${x}`;
    default: return `woord${x} ${x}woord n${x}n`;
  }
}

const show = ch => /\p{Mn}/u.test(ch) ? '\u25CC' + ch : ch;   // combining marks sit on a dotted circle

let F;
async function select(c, scroll) {
  current = c;
  words = contextFor(c);
  document.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-selected', t.dataset.c === c.c));
  await drawDetail();
  if (scroll && matchMedia('(max-width: 900px)').matches) $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function variantsFor(c) {
  const base = shapeKey(F, words, state);
  const out = [];
  for (const f of FEATURES) {
    if (!/^ss/.test(f.tag)) continue;
    const s2 = Object.assign({}, state, { [f.tag]: !state[f.tag] });
    if (shapeKey(F, words, s2) !== base) out.push(f);
  }
  return out;
}

async function drawDetail() {
  const c = current, d = $('detail');
  if (!c) return;
  F ||= await loadFont();
  const [label, desc] = STATUS[c.status];
  d.innerHTML = `
    <h2><span class="big" style="font-family:Vtex"></span><span class="nm"></span></h2>
    <p class="meta"><span class="badge st-${c.status}">${label}</span> <span class="desc"></span></p>
    <div class="sheet" id="sheet"></div>
    <label class="lbl" for="words">In woorden (je mag dit aanpassen)</label>
    <input type="text" id="words" spellcheck="false">
    <div id="variantsBox"></div>
    <p class="hint" id="issueLine"></p>
    <button type="button" class="btn-feedback" id="fbChar">Feedback op dit teken</button>`;
  d.querySelector('.big').textContent = show(c.c);
  d.querySelector('.nm').textContent = `${hexU(c.c)} · ${c.name}`;
  let extra = desc;
  if (c.base) extra += ` Gemaakt van ${c.base}${c.accent ? ' + ' + c.accent : ''}.`;
  if (c.inferred) extra += ' De plaats van het accent is geschat.';
  d.querySelector('.desc').textContent = extra;
  $('words').value = words;
  $('words').addEventListener('input', e => { words = e.target.value; drawSheet(); drawVariants(); syncHash(); });
  if (c.issue) {
    const a = document.createElement('a');
    a.href = c.issue.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = `#${c.issue.number} ${c.issue.title}`;
    $('issueLine').append('Hierover loopt al een vraag: ', a, '. Reageer daar gerust.');
  }
  $('fbChar').addEventListener('click', () => sendFeedback());
  drawSheet(); drawVariants(); syncHash();
}

function drawSheet() {
  const lines = [{ text: current.c, state }];
  if (words.trim()) lines.push({ text: words, state });
  $('sheet').replaceChildren(renderLines(F, lines, { size: 110 }));
}

function drawVariants() {
  const box = $('variantsBox'); box.replaceChildren();
  const vs = variantsFor(current);
  if (!vs.length) return;
  const l = document.createElement('p'); l.className = 'lbl'; l.style.margin = '14px 0 6px';
  l.textContent = 'Andere vormen (lettervormen aan- of uitzetten):';
  const grid = document.createElement('div'); grid.className = 'variants';
  for (const f of vs) {
    const s2 = Object.assign({}, state, { [f.tag]: !state[f.tag] });
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'variant' + (state[f.tag] ? ' on' : '');
    b.title = f.name;
    b.innerHTML = '<span class="v"></span><span class="t"></span>';
    b.querySelector('.v').textContent = words.split(' ')[0] || current.c;
    b.querySelector('.v').style.fontFeatureSettings = cssFeatures(state[f.tag] ? state : s2);
    b.querySelector('.t').textContent = `${f.tag} ${state[f.tag] ? 'aan' : ''} · ${f.name}`;
    b.addEventListener('click', () => { state[f.tag] = !state[f.tag]; refresh(); });
    grid.appendChild(b);
  }
  box.append(l, grid);
}

function syncHash() {
  setHash([['teken', current ? current.c : ''], ['woorden', current && words !== contextFor(current) ? words : ''],
           ['groep', group === 'all' ? '' : group], ['code', linkCode(state) === 'vtex' ? '' : linkCode(state)]]);
}

async function sendFeedback() {
  const c = current;
  const b = await build();
  const cap = `${versionText(b)} · ${encode(state)}`;
  feedback({
    template: 'teken.yml',
    title: `[Teken] ${c.c} (${hexU(c.c)})`,
    fields: { teken: `${c.c} (${hexU(c.c)}, ${c.name}, ${STATUS[c.status][0].toLowerCase()})`, tekst: words, instellingen: encode(state) },
    snapshot: () => renderLines(F, [{ text: c.c, state }, ...(words.trim() ? [{ text: words, state }] : [])], { size: 120, caption: cap }),
  });
}

function refresh() { drawToolbar(); drawFeatures(); drawGrid(); if (current) drawDetail(); else syncHash(); }

$('find').addEventListener('input', drawGrid);
$('fb-nav').addEventListener('click', () => current ? sendFeedback() : feedback({ template: 'algemeen.yml', title: '[Opmerking] ', fields: { instellingen: encode(state) } }));
refresh();
F = await loadFont();
const start = byChar.get(hp.get('teken'));
if (start) { words = hp.get('woorden') || contextFor(start); current = start; drawGrid(); drawDetail(); }
</script>
</body>
</html>
